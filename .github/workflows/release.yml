name: Build and Release Routing Rules

on:
  schedule:
    - cron: "0 2 * * 1"   # каждую неделю в 02:00 UTC
  workflow_dispatch:        # ручной запуск
  push:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sing-box
        run: |
          bash <(curl -fsSL https://sing-box.app/deb-install.sh)
          sing-box version

      - name: Build all rule sets
        run: python3 build.py

      - name: List generated artifacts
        run: ls -lh *.srs *-cidrs.txt

      # Пушим артефакты в ветку release (для jsDelivr CDN и raw.githubusercontent)
      - name: Commit artifacts to release branch
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b release 2>/dev/null || git checkout release
          git add *.srs *-cidrs.txt
          git commit -m "chore: auto-update lists [$(date -u '+%Y-%m-%d %H:%M UTC')]" \
            || echo "No changes to commit"
          git push -f origin release

      # Публикуем те же файлы как GitHub Release (для gh-proxy и прямых ссылок)
      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Routing Rules — Auto-update"
          body: |
            Автоматическая сборка актуальных CIDR-правил маршрутизации.
            Обновляется ежедневно в **02:00 UTC**.

            | Набор | Описание | SRS | TXT |
            |---|---|---|---|
            | `16-kb` | CDN-подсети из 16-kb DPI-детектора | [16-kb.srs](../../releases/download/latest/16-kb.srs) | [16-kb-cidrs.txt](../../releases/download/latest/16-kb-cidrs.txt) |
            | `telegram` | Официальные CIDR Telegram | [telegram.srs](../../releases/download/latest/telegram.srs) | [telegram-cidrs.txt](../../releases/download/latest/telegram-cidrs.txt) |

            > Новый набор правил добавляется через одну строку в `SOURCES` в `build.py`.
          files: |
            *.srs
            *-cidrs.txt
          make_latest: true
