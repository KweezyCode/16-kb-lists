name: Build and Release 16-kb CIDR Rules

on:
  schedule:
    - cron: "0 2 * * *" # Автоматический запуск каждый день в 2:00 ночи (UTC)
  workflow_dispatch: # Позволяет запускать Action вручную по кнопке
  push:
    branches:
      - master
      - main

permissions:
  contents: write # Разрешение на создание релизов

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install sing-box
        run: |
          bash <(curl -fsSL https://sing-box.app/deb-install.sh)
          sing-box version

      - name: Generate SRS, IPs and CIDRs
        run: |
          python3 build.py

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "latest" # Фиксированный тег (удобно для постоянных ссылок)
          name: "16-kb Routing Rules (Auto-update)"
          body: "Автоматическая ночная сборка актуальных 16-kb CIDR подсетей (SRS + CIDR + Плоский список IP)."
          files: |
            16-kb.srs
            16-kb-cidrs.txt
            16-kb-ips.txt
          make_latest: true
